server:
  port: 8080
app:
  webhook_secret: foobarbaz123

database:
  encryption_key: super_s3cret
  type: sqlite
  filename: ./database.sqlite

# Internal queue for decoupling webhook receiver from event processing
# When enabled, events are queued for async processing which provides:
# - Better resilience (events persist if process crashes)
# - Horizontal scaling (multiple workers can process from same queue)
# - Back-pressure handling (receiver can quickly ACK to GitHub)
internal_queue:
  enabled: false  # Set to true to enable queue-based processing
  type: memory    # memory, redis, kafka, amqp, sqs, azure-eventhub
  consumer_count: 1
  poll_interval_ms: 100
  visibility_timeout_ms: 30000
  
  # Redis configuration (when type: redis)
  # redis:
  #   url: redis://localhost:6379
  #   password: ""
  #   stream_name: github-events
  #   consumer_group: event-workers
  
  # Kafka configuration (when type: kafka)
  # kafka:
  #   brokers:
  #     - localhost:9092
  #   topic: github-events
  #   client_id: github-event-router
  #   group_id: event-workers
  
  # AMQP/RabbitMQ configuration (when type: amqp)
  # amqp:
  #   url: amqp://localhost:5672
  #   queue_name: github-events
  #   exchange: github-events

event_processing:
  retry:
    max_attempts: 3
    backoff_strategy: exponential
    initial_delay_ms: 1000
    max_delay_ms: 30000
    retryable_status_codes: [500, 502, 503, 504, 408, 429]

  timeouts:
    http_delivery_timeout_ms: 10000
    redis_delivery_timeout_ms: 5000

  queue:
    batch_size: 10
    processing_interval_ms: 1000
    dead_letter_threshold: 5

monitoring:
  enable_metrics: true
  log_level: info
  failed_delivery_alerts: true

security:
  enable_rate_limiting: true
  requests_per_minute: 1000
  payload_size_limit_mb: 10
