name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build:server

      - name: Vite (UI) build
        run: npm run build:ui

      - name: Run tests
        run: npm run test:ci
